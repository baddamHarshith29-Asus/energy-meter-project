name: CI and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt
        # Adding a check for Groq/OpenAI keys to avoid failure if missing
        env:
          DATABASE_URL: sqlite:///test_energy.db

      - name: Start Backend
        run: |
          python backend/app.py &
          sleep 10
        env:
          DATABASE_URL: sqlite:///test_energy.db

      - name: Run Backend Tests
        run: python backend/test_backend.py
        env:
          DATABASE_URL: sqlite:///test_energy.db

  build-frontend:
    runs-on: ubuntu-latest
    needs: backend-test # Ensure backend tests pass before building frontend (optional, but good for "integration")
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
